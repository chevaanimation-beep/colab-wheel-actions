name: Build llama-cpp-python CUDA Wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # 同时编译 3.13（匹配当前 Colab）与 3.12（备用）
        python-version: ['3.13', '3.12']

    steps:
    # 核心：直接拉取 upstream 官方仓库最新代码，并必须递归拉取 llama.cpp 子模块
    - name: Checkout Latest llama-cpp-python
      uses: actions/checkout@v4
      with:
        repository: abetlen/llama-cpp-python
        submodules: recursive
        fetch-depth: 1

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.21
      id: cuda-toolkit
      with:
        cuda: '12.8.0'
        method: 'network'
        sub-packages: '["toolkit", "nvcc"]'

    - name: Verify NVCC
      run: |
        nvcc --version

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools scikit-build-core[pyproject] cmake ninja

    - name: Build Wheel with CUDA
      env:
        GGML_CUDA: 'on'
        CMAKE_ARGS: '-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=75'
      run: |
        # 直接使用本地检出的最新源码构建 wheel
        pip wheel . --wheel-dir=dist --no-deps

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-py${{ matrix.python-version }}
        path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: all-dist
        merge-multiple: true

    - name: Create GitHub Release and Upload Wheel
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release CUDA Wheel v1.0.${{ github.run_number }}
        files: all-dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
